      .pranam-link {

    bottom: 2vw;
    width: 9vw;

}

/* ✅ safety net: guarantee .hidden actually removes the nav button */

}

<!-- ── Audio feedback: click / navigation / home ── -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    // Preload audio instances so overlapping taps don't cut playback short
    const clickAudio = new Audio("./audio/click.mp3");
    const swipeAudio = new Audio("./audio/swipe.mp3");
    const popAudio = new Audio("./audio/pop.mp3");

    function playSound(baseAudio) {
      // Clone so rapid repeated clicks always restart cleanly
      const sound = baseAudio.cloneNode();
      sound.play().catch(function (err) {
        console.warn("Audio playback blocked or failed:", err);
      });
    }

    // 1) Click button (.click) → click.mp3
    document.addEventListener("click", function (e) {
      if (e.target.closest(".click")) {
        playSound(clickAudio);
      }
    });

    // 2) Navigation buttons (#btnPrev, #btnNext) → swipe.mp3
    const btnPrev = document.getElementById("btnPrev");
    const btnNext = document.getElementById("btnNext");

    if (btnPrev) {
      btnPrev.addEventListener("click", function () {
        playSound(swipeAudio);
      });
    }

    if (btnNext) {
      btnNext.addEventListener("click", function () {
        playSound(swipeAudio);
      });
    }

    // 3) Home button (.home-btn) → pop.mp3
    const homeBtn = document.querySelector(".home-btn");
    if (homeBtn) {
      homeBtn.addEventListener("click", function (e) {
        // Play pop sound, then let the navigation happen naturally.
        // Slight delay so the sound isn't cut off by page unload.
        e.preventDefault();
        playSound(popAudio);
        const href = homeBtn.getAttribute("href");
        setTimeout(function () {
          window.location.href = href;
        }, 150);
      });
    }
  });
</script>

<!-- ── Last slide: show Pranam link + hide Next button ── -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const pranamLink = document.getElementById("pranamLink");
    const btnNext = document.getElementById("btnNext");
    const swiperWrapper = document.querySelector("#mySwiper .swiper-wrapper");

    if (!swiperWrapper) return;

    function updateLastSlideState() {
      const slides = swiperWrapper.querySelectorAll(".swiper-slide");
      if (!slides.length) return;

      const lastSlide = slides[slides.length - 1];
      const isLastSlideActive = lastSlide.classList.contains("swiper-slide-active");

      // Pranam link → only on the last slide
      if (pranamLink) {
        if (isLastSlideActive) {
          pranamLink.classList.add("show");
        } else {
          pranamLink.classList.remove("show");
        }
      }

      // ✅ Next button → hidden on the last slide, visible everywhere else
      if (btnNext) {
        if (isLastSlideActive) {
          btnNext.classList.add("hidden");
        } else {
          btnNext.classList.remove("hidden");
        }
      }
    }

    // Run once in case the swiper has already initialized before this script runs
    updateLastSlideState();

    // Watch for Swiper toggling "swiper-slide-active" on slides as the user navigates
    const observer = new MutationObserver(updateLastSlideState);
    observer.observe(swiperWrapper, {
      attributes: true,
      attributeFilter: ["class"],
      subtree: true,
    });
  });
</script>
